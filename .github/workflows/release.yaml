name: Release package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    name: Build DEB packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os:
          - { name: debian, version: "11" }
          - { name: debian, version: "12" }
          - { name: ubuntu, version: "22.04" }
          - { name: ubuntu, version: "24.04" }
    container:
      image: ${{ matrix.os.name }}:${{ matrix.os.version }}
    steps:
      - name: Install build tools
        run: |
          apt-get update
          if [ "${{ matrix.os.name }}" = "ubuntu" ]; then
            apt-get install -y software-properties-common
            add-apt-repository -y universe
            apt-get update
          fi
          apt-get install -y \
            autoconf \
            automake \
            bash \
            build-essential \
            ca-certificates \
            debhelper \
            devscripts \
            dpkg-dev \
            git
          apt-get install -y shc || {
            git clone --depth 1 https://github.com/neurobin/shc.git /tmp/shc
            cd /tmp/shc
            ./configure --prefix=/usr
            make -j"$(nproc)"
            make install
          }

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag or use default
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "Building version $VERSION from tag"
          else
            VERSION="0.0.0"
            echo "Building default version $VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update Debian changelog
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          dch --create \
            --package kubee \
            --newversion "${{ steps.version.outputs.version }}-1" \
            --distribution unstable \
            --empty \
            "Release ${{ steps.version.outputs.version }}"

      - name: Build DEB
        run: dpkg-buildpackage -us -uc -b -d

      - name: Move DEB packages
        run: |
          mkdir -p dist/deb
          ARCH=$(dpkg --print-architecture)
          for deb in ../*.deb; do
            if [ -f "$deb" ]; then
              mv "$deb" "dist/deb/kubee_${{ steps.version.outputs.version }}_${ARCH}-${{ matrix.os.name }}${{ matrix.os.version }}.deb"
            fi
          done

      - name: Upload DEB packages
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.os.name }}-${{ matrix.os.version }}
          path: dist/deb/*.deb
          retention-days: 1

  build-rpm:
    name: Build RPM packages
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os:
          - { name: "rockylinux/rockylinux", version: "10", dist: el10 }
          - { name: "rockylinux/rockylinux", version: "9", dist: el9 }
          - { name: almalinux, version: "8", dist: el7 } # 用 alma8 编译 el7
    container:
      image: ${{ matrix.os.name }}:${{ matrix.os.version }}
    steps:
      # 所有系统使用 checkout@v4
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag or use default
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Building version $VERSION from tag"
          fi

      - name: Install build tools
        run: |
          if [ "${{ matrix.os.name }}" == "almalinux" ] && [ "${{ matrix.os.version }}" == "8" ]; then
            # AlmaLinux 8 (编译 el7)
            dnf install -y epel-release
            dnf install -y git rpm-build rpmdevtools make gcc shc
          elif [ "${{ matrix.os.version }}" == "10" ]; then
            # Rocky Linux 10 / EL10
            dnf install -y epel-release
            dnf install -y git rpm-build rpmdevtools make gcc
            dnf install -y shc || {
              # Fallback if shc is not in EPEL 10 yet
              curl -L -O http://download.fedoraproject.org/pub/epel/9/Everything/x86_64/Packages/s/shc-4.0.3-11.el9.x86_64.rpm
              rpm -ivh shc-4.0.3-11.el9.x86_64.rpm --nodeps
            }
          else
            # Rocky Linux 9
            dnf install -y git rpm-build rpmdevtools make gcc
            # 从 Fedora EPEL 下载 shc
            curl -L -O http://download.fedoraproject.org/pub/epel/9/Everything/x86_64/Packages/s/shc-4.0.3-11.el9.x86_64.rpm
            rpm -ivh shc-4.0.3-11.el9.x86_64.rpm
          fi

      - name: Setup rpmbuild directories
        run: mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

      - name: Copy source files
        run: |
          cp kubee.sh ~/rpmbuild/SOURCES/
          cp kubee-aliases.sh ~/rpmbuild/SOURCES/
          cp README.md ~/rpmbuild/SOURCES/
          if [ ! -f LICENSE ]; then
            echo "MIT License" > ~/rpmbuild/SOURCES/LICENSE
          else
            cp LICENSE ~/rpmbuild/SOURCES/
          fi

      - name: Copy spec file
        run: cp rpm/kubee.spec ~/rpmbuild/SPECS/

      - name: Build RPM
        run: |
          if [ "${{ matrix.os.dist }}" == "el7" ]; then
            # 编译为 el7 包
            rpmbuild --define "_version ${{ steps.version.outputs.version }}" --define "dist .el7" -bb ~/rpmbuild/SPECS/kubee.spec
          else
            # 使用默认 dist
            rpmbuild --define "_version ${{ steps.version.outputs.version }}" -bb ~/rpmbuild/SPECS/kubee.spec
          fi

      - name: Copy RPM packages
        run: |
          mkdir -p dist/rpm
          cp ~/rpmbuild/RPMS/*/*.rpm dist/rpm/

      - name: Upload RPM packages
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.os.dist }}
          path: dist/rpm/*.rpm
          retention-days: 1

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-deb, build-rpm]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate release notes
        shell: bash
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREVIOUS_TAG=$(git tag --sort=-version:refname --merged "${CURRENT_TAG}" \
            | grep -Fvx "${CURRENT_TAG}" \
            | head -n 1 || true)

          {
            echo "## Changes"
            echo
            if [ -n "${PREVIOUS_TAG}" ]; then
              git log \
                --pretty=format:"- %s ([%h](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/%H))" \
                "${PREVIOUS_TAG}..${CURRENT_TAG}"
              echo
              echo
              echo "## Full Changelog"
              echo
              echo "[${PREVIOUS_TAG}...${CURRENT_TAG}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${CURRENT_TAG})"
            else
              git log \
                --pretty=format:"- %s ([%h](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/%H))" \
                "${CURRENT_TAG}"
            fi
          } > release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/**/*.deb
            dist/**/*.rpm
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
